plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'net.fabricmc.fabric-loom'

    base {
        archivesName = "${rootProject.archives_name}-${project.name}-${rootProject.minecraft_version}"
    }

    repositories {
        mavenCentral()

        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }

        // Forge Config API Port
        maven {
            name = 'Fuzs Mod Resources'
            url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/'
        }

    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(rootProject.java_version as int)
        }
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = rootProject.java_version as int
        options.encoding = 'UTF-8'
        // Keep migration diagnostics from being truncated at javac's default 100 errors.
        options.compilerArgs.addAll(['-Xmaxerrs', '1000'])
    }
}
