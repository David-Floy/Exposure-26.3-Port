loom {
    accessWidenerPath = file('src/main/resources/exposure.accesswidener')
}

sourceSets {
    main {
        java {
            // Optional integrations are preserved in the repository but are not part of
            // the first Fabric 26.1.2 compilation pass.
            exclude 'io/github/mortuusars/exposure/integration/jei/**'
            exclude 'io/github/mortuusars/exposure/integration/jade/**'
            exclude 'io/github/mortuusars/exposure/integration/ModCompatibilityClient.java'
            exclude 'io/github/mortuusars/exposure/integration/compat/**'
            exclude 'io/github/mortuusars/exposure/mixin/compat/easy_anvils/**'
        }
    }
}

dependencies {
    api "fuzs.forgeconfigapiport:forgeconfigapiport-common-neoforgeapi:${rootProject.forge_config_api_port_version}"

    testImplementation platform("org.junit:junit-bom:${rootProject.junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}
