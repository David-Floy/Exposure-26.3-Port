name: Build

on:
  push:
    branches:
      - "26.1.2"
  pull_request:
    branches:
      - "26.1.2"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compile, test, validate Access Wideners, and build
        run: >-
          ./gradlew --no-daemon --stacktrace
          :common:compileJava
          :fabric:compileJava
          :common:compileTestJava
          :common:test
          :common:validateAccessWidener
          :fabric:validateAccessWidener
          build
