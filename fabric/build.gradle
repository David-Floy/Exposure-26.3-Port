loom {
    accessWidenerPath = project(':common').file('src/main/resources/exposure.accesswidener')

    // Treat the common and Fabric source sets as one mod in development runs.
    // The production jar already merges the same outputs below.
    mods {
        exposure {
            sourceSet project(':common').sourceSets.main
            sourceSet sourceSets.main
        }
    }

    // Loom generates IntelliJ run configurations only for the root project by default.
    // This adds "Minecraft Client (:fabric)" and "Minecraft Server (:fabric)" for this module.
    runs {
        configureEach {
            ideConfigGenerated(true)
        }
    }
}

sourceSets {
    main {
        java {
            // Keep optional integrations in source control, but outside this migration pass.
            exclude 'io/github/mortuusars/exposure/integration/jei/**'
            exclude 'io/github/mortuusars/exposure/fabric/integration/create/**'
            exclude 'io/github/mortuusars/exposure/fabric/mixin/create/**'
        }
    }
}

dependencies {
    implementation project(':common')
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    implementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${rootProject.forge_config_api_port_version}"
}

processResources {
    def expandProps = [
            mod_id                       : rootProject.mod_id,
            mod_name                     : rootProject.mod_name,
            mod_version                  : rootProject.mod_version,
            mod_authors                  : rootProject.mod_authors,
            mod_description              : rootProject.mod_description,
            mod_page                     : rootProject.mod_page,
            mod_github                   : rootProject.mod_github,
            mod_issues                   : rootProject.mod_issues,
            mod_license                  : rootProject.mod_license,
            minecraft_version            : rootProject.minecraft_version,
            fabric_loader_version        : rootProject.fabric_loader_version,
            fabric_api_version           : rootProject.fabric_api_version,
            forge_config_api_port_version: rootProject.forge_config_api_port_version
    ]

    inputs.properties(expandProps)
    filesMatching('fabric.mod.json') {
        expand expandProps
    }
}

// The Fabric distribution contains both the platform sources and the common output.
tasks.named('jar', Jar) {
    from(project(':common').sourceSets.main.output)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('sourcesJar', Jar) {
    from(project(':common').sourceSets.main.allSource)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
